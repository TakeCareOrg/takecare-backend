<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TakeCare Reset Password</title>
    </head>

    <body
        style="
            margin: 0;
            padding: 0;
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            border-radius: 12px;
        "
    >
        <table
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="
                border-collapse: collapse;
                background-color: #f5f5f5;
                border-radius: 12px;
            "
        >
            <tr>
                <td align="center">
                    <table
                        cellpadding="0"
                        cellspacing="0"
                        width="650"
                        style="border-collapse: collapse; margin: 0 auto"
                    >
                        <!-- Logo Section -->
                        <tr>
                            <td align="center" style="padding: 40px 0">
                                <img
                                    src="https://sow9j.mjt.lu/img2/sow9j/e85e9fa0-ed61-464c-af6f-1ea905bd3170/content"
                                    alt="Logo TakeCareAI"
                                    width="100px"
                                    height="100px"
                                    style="border-radius: 16px"
                                />
                            </td>
                        </tr>
                        <!-- Content Section -->
                        <tr>
                            <td align="center" style="padding: 0 20px">
                                <h1
                                    style="
                                        font-size: 36px;
                                        font-weight: 400;
                                        color: #394792;
                                        margin-bottom: 20px;
                                    "
                                >
                                    Reset Password
                                </h1>
                                <p
                                    style="
                                        font-size: 18px;
                                        line-height: 24px;
                                        color: #555;
                                        margin-bottom: 30px;
                                    "
                                >
                                    You decided to reset your password. Please
                                    use the following code to reset your
                                    password.
                                </p>
                                <p
                                    style="
                                        font-size: 34px;
                                        color: #777;
                                        margin-top: 20px;
                                        margin-bottom: 30px;
                                    "
                                >
                                    {{resetCode}}
                                </p>
                                <p
                                    style="
                                        font-size: 14px;
                                        color: #777;
                                        margin-top: 20px;
                                    "
                                >
                                    TakeCare is only supported on mobile
                                    devices.
                                </p>
                            </td>
                        </tr>
                        <!-- Footer Section -->
                        <tr>
                            <td align="center" style="padding: 40px 20px">
                                <p
                                    style="
                                        font-size: 14px;
                                        line-height: 20px;
                                        color: #777;
                                    "
                                >
                                    You received this email because you decided
                                    to reset your password. If this was a
                                    mistake, ignore this email.
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
