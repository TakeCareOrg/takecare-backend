global:
    scrape_interval: 15s
    scrape_timeout: 10s

scrape_configs:
    - job_name: "prometheus"
      static_configs:
          - targets: ["localhost:9090"]

    - job_name: "express"
      metrics_path: "/metrics"
      static_configs:
          # Resolvable when Prometheus and the API share the same Docker network.
          # The service name "express" must match the API container's service/alias.
          # For local dev against an API running on the host, override with
          # host.docker.internal:4000 (Docker Desktop) or the host IP.
          - targets: ["express:4000"]
