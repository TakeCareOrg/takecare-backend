# monitoring/docker-compose.yml
#
# Standalone monitoring stack (Prometheus + Grafana).
# Both services join the `takecare_net` network so they can reach the API
# container by its service name (default: "express" on port 4000).
#
# 1. Create the shared network once:
#      docker network create takecare_net
# 2. Make sure the API container joins it too (set `networks: [takecare_net]`
#    in the API's compose file, or run it with `--network takecare_net`).
# 3. Copy .env.example to .env and set GRAFANA_PASSWORD.
# 4. From this directory: docker compose up -d
services:
    prometheus:
        image: prom/prometheus:latest
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=15d"
        ports:
            - "127.0.0.1:9090:9090" # Only localhost, not public
        networks:
            - takecare_net
        restart: unless-stopped

    grafana:
        image: grafana/grafana:latest
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
            - GF_USERS_ALLOW_SIGN_UP=false
        ports:
            - "127.0.0.1:7001:3000" # Only localhost
        networks:
            - takecare_net
        restart: unless-stopped
        depends_on:
            - prometheus

volumes:
    prometheus_data:
    grafana_data:

networks:
    takecare_net:
        external: true
