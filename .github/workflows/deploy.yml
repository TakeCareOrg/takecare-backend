name: Deploy

on:
    push:
        branches: [main, develop]

concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint & Format Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Check linting
              run: npm run lint

            - name: Check Prettier formatting
              run: npm run format:check

    # test:
    #     name: Run Tests
    #     runs-on: ubuntu-latest
    #     needs: lint
    #     continue-on-error: true # TODO: remove this once test suite is stable
    #     steps:
    #         - uses: actions/checkout@v4
    #         - uses: actions/setup-node@v4
    #           with:
    #               node-version: 18
    #               cache: npm
    #         - run: npm ci
    #         - run: npm test

    build:
        name: Build Check
        runs-on: ubuntu-latest
        needs: lint

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build TypeScript
              run: npm run build

    deploy:
        name: Deploy
        needs: [lint, build] # TODO: add test back when test suite is stable
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Set environment variables
              run: |
                  if [ "${{ github.ref_name }}" = "main" ]; then
                    echo "CONTAINER=takecare-api" >> $GITHUB_ENV
                    echo "PORT=3001" >> $GITHUB_ENV
                  else
                    echo "CONTAINER=takecare-api-beta" >> $GITHUB_ENV
                    echo "PORT=3002" >> $GITHUB_ENV
                  fi
                  echo "IMAGE=ghcr.io/takecareorg/takecare-api:${{ github.ref_name }}" >> $GITHUB_ENV

            - name: Login to GHCR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/takecareorg/takecare-api:${{ github.ref_name }}
                      ghcr.io/takecareorg/takecare-api:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Deploy to VPS
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  envs: CONTAINER,PORT,IMAGE
                  script: |
                      echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

                      docker pull $IMAGE

                      docker stop $CONTAINER 2>/dev/null || true
                      docker rm $CONTAINER 2>/dev/null || true

                      docker run -d \
                        --restart unless-stopped \
                        --name $CONTAINER \
                        --env-file ~/takecare-api/.env \
                        --network host \
                        -e PORT=$PORT \
                        $IMAGE

                      # Health check
                      sleep 5
                      if ! docker ps | grep -q $CONTAINER; then
                        echo "FAILED! Container logs:"
                        docker logs $CONTAINER
                        exit 1
                      fi

                      echo "Deployed $CONTAINER on port $PORT"

                      docker image prune -f
