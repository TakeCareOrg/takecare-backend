name: Deploy to VPS

on:
    push:
        branches:
            - main
            - develop

concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              run: echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/${{ secrets.DOCKER_USERNAME }}/takecare-api-beta:${{ github.ref_name }}
                      ghcr.io/${{ secrets.DOCKER_USERNAME }}/takecare-api-beta:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Deploy to VPS
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: 22
                  script: |
                      cd ~/takecare-api
                      echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

                      BRANCH=${{ github.ref_name }}

                      if [ "$BRANCH" = "main" ]; then
                        CONTAINER_NAME="takecare-api"
                        PORT=3001
                      else
                        CONTAINER_NAME="takecare-api-beta"
                        PORT=3002
                      fi

                      IMAGE_NAME=ghcr.io/${{ secrets.DOCKER_USERNAME }}/takecare-api-beta:$BRANCH

                      # Pull the latest image
                      docker pull $IMAGE_NAME

                      # Stop and remove the existing container if it exists
                      docker stop $CONTAINER_NAME || true
                      docker rm $CONTAINER_NAME || true

                      # Run the new container with restart policy
                      docker run -d --restart unless-stopped --name $CONTAINER_NAME --env-file .env -p $PORT:4000 $IMAGE_NAME

                      # Wait and verify the container is running
                      sleep 5
                      if docker ps --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
                        echo "Container $CONTAINER_NAME is running successfully."
                      else
                        echo "ERROR: Container $CONTAINER_NAME failed to start!"
                        docker logs $CONTAINER_NAME
                        exit 1
                      fi

                      # Clean up old unused images
                      docker image prune -f
